# ═══════════════════════════════════════════════════════════════
# فضاء الطباعة الرقمية — Netlify Configuration
# ═══════════════════════════════════════════════════════════════
#
# ⚠️ IMPORTANT: Netlify has severe limitations for this app:
#   - Free plan: 10-second function timeout (GAS calls need 10-60s)
#   - Free plan: 6MB payload limit (base64 files exceed this)
#   - Pro plan: 26-second timeout (still may not be enough)
#
# ✅ RECOMMENDED: Deploy to Vercel instead (60s timeout on free plan)
#    Or use Railway/Render for persistent server (no timeout limits)
#
# The app now uses DIRECT browser-to-GAS uploads to bypass these
# limits. The /api/orders route responds immediately and syncs to
# Google Sheets in the background (fire-and-forget).
# ═══════════════════════════════════════════════════════════════

[build]
  command = "npm run build"
  publish = ".next"

# Next.js runtime plugin for Netlify
[[plugins]]
  package = "@netlify/plugin-nextjs"

# API functions configuration
[functions]
  node_bundler = "esbuild"

# Specific function configuration for longer-running routes
# Note: maxDuration only works on Netlify Pro (paid plan)
[functions."api-orders"]
  maxDuration = 26

[functions."api-upload-file"]
  maxDuration = 26

# Headers for API routes
[[headers]]
  for = "/api/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, POST, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type"
